<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pantry Chef">
  <meta name="theme-color" content="#9b5de5">
  <title>{% block title %}Pantry Chef{% endblock %}</title>
  <!-- App icons: the home-screen icon on iPad/iPhone, and the browser tab icon -->
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top-bar">
    <a href="{{ url_for('pantry_page') }}" class="logo">🍳 Pantry Chef</a>
    {% if session.get("logged_in") %}
      <nav class="top-links">
        <a href="{{ url_for('pantry_page') }}">Pantry</a>
        <a href="{{ url_for('my_recipes_page') }}">My recipes</a>
        <form method="post" action="{{ url_for('logout_action') }}">
          <button type="submit" class="logout">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main>
    {% for message in get_flashed_messages() %}
      <p class="notice">{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
