{% extends "base.html" %}

{% block title %}{{ recipe.title }} · Pantry Chef{% endblock %}

{% block content %}
  <p><a href="{{ url_for('my_recipes_page') }}">← Back to my recipes</a></p>
  <h1>{{ recipe.title }}</h1>
  <div class="saved-recipe-text">{{ recipe.text }}</div>

  <form method="post" action="{{ url_for('delete_my_recipe_action', recipe_id=recipe.id) }}"
        onsubmit="return confirm('Delete this recipe?');" style="margin-top: 24px">
    <button type="submit" class="button danger">Delete recipe</button>
  </form>
{% endblock %}
