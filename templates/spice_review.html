{% extends "base.html" %}

{% block title %}Check the spices · Pantry Chef{% endblock %}

{% block content %}
  <h1>Check the spices</h1>
  <p>Untick anything you don't want to add. Each spice is added as 1 jar.</p>

  <form method="post" action="{{ url_for('add_spices_action') }}">
    {% for spice in plan %}
      <label class="spice-choice">
        <input type="checkbox" name="spice" value="{{ spice.name }}"
               {% if not spice.already_have %}checked{% else %}disabled{% endif %}>
        {{ spice.name }}
        {% if spice.already_have %}<span class="hint">already in your pantry</span>{% endif %}
      </label>
    {% endfor %}

    <div class="form-buttons" style="margin-top: 16px">
      <button type="submit" class="button primary">Add to pantry</button>
      <a href="{{ url_for('pantry_page') }}" class="button">Cancel</a>
    </div>
  </form>
{% endblock %}
